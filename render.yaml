services:
  - type: web
    name: fisherman-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEO4J_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
